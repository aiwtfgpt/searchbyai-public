# ==============================================================================
# docker-compose.cloud.yml — AI stack, no GPU
#
# Same stack as the GPU build minus Ollama. Nothing runs a model locally;
# n8n, Open WebUI and LightRAG all call a cloud provider instead.
#
# CPU inference is deliberately not offered. A 9GB model answering at a few
# tokens per second is a worse experience than an API key, and it makes the
# machine unusable while it runs.
#
# Services:
#   open-webui   chat interface, talks to your provider
#   n8n          workflow automation
#   crawl4ai     web scraping for agents
#   lightrag     retrieval over your own documents
#   mirofish     graph intelligence (profile: graph)
#   neo4j        graph database MiroFish requires (profile: graph)
#   rss-bridge   feed conversion (profile: feeds)
#   cloudflared  public HTTPS with no open ports and no static IP
#
# You need one API key. Set ONE of these in .env — install-stack.sh prompts
# for it and writes the rest:
#
#   ANTHROPIC_API_KEY   console.anthropic.com/settings/keys
#   OPENAI_API_KEY      platform.openai.com/api-keys
#   GEMINI_API_KEY      aistudio.google.com/apikey
#
# Ports bind to 127.0.0.1; public access is the tunnel's job.
#
# Start:  docker compose -f docker-compose.cloud.yml up -d
# ==============================================================================

services:
  # CPU by default so the stack installs on any machine. install-stack.sh
  # detects a GPU and adds the override file that gives this container the
  # card — see docker-compose.gpu.yml.
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
      - open_webui_config:/app/backend/config
    networks:
      - ai_network
    environment:
      # OpenAI-compatible endpoint. Anthropic and Gemini both publish one,
      # so a single pair of variables covers all three providers —
      # install-stack.sh sets them from whichever key you supplied.
      - OPENAI_API_BASE_URL=${LLM_BASE_URL}
      - OPENAI_API_KEY=${LLM_API_KEY}
      - ENABLE_OLLAMA_API=false
      # Lets you mint an API key for your own tools.
      - ENABLE_API_KEY=true
      # Generated per install by install-stack.sh. Must stay stable across
      # restarts or every session is invalidated.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai_network
    environment:
      # Set by cloudflare-setup.sh to the real public hostname. n8n builds
      # webhook and OAuth callback URLs from this, so a wrong value produces
      # OAuth redirects that fail with no useful error.
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      # Code nodes cannot read environment variables. Leaving this false
      # would let any workflow — including one pasted from a template —
      # print your tunnel token and API keys.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chromium crashes on the default 64MB of shared memory.
    shm_size: 1g
    networks:
      - ai_network
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      - crawl4ai_cache:/app/cache

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:9621:9621"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BINDING=openai
      - LLM_BINDING_HOST=${LLM_BASE_URL}
      - LLM_BINDING_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      # Embeddings need OpenAI specifically — Anthropic has no embedding API
      # and Gemini's is not OpenAI-compatible. Without an OpenAI key,
      # LightRAG cannot index and the other services are unaffected.
      - EMBEDDING_BINDING=openai
      - EMBEDDING_BINDING_HOST=https://api.openai.com/v1
      - EMBEDDING_BINDING_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # Must match the embedding model's dimensions, or the index corrupts.
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - RAG_DIR=/app/data/rag_storage
      - AUTH_ACCOUNTS=${LIGHTRAG_AUTH_ACCOUNTS}
      - TOKEN_SECRET=${LIGHTRAG_TOKEN_SECRET}
      - TOKEN_EXPIRE_HOURS=8760
      - WHITELIST_PATHS=/health
    volumes:
      - lightrag_data:/app/data
    networks:
      - ai_network

  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: rss-bridge
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - ai_network
    profiles:
      # Optional. Start with: docker compose --profile feeds up -d
      - feeds

  # --- Graph intelligence -----------------------------------------------------
  # Optional. Start with: --profile graph
  mirofish:
    build:
      context: ./mirofish
    container_name: mirofish
    profiles: [graph]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - mirofish_uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - ai_network

  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j
    profiles: [graph]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    # Token written by cloudflare-setup.sh. Outbound-only: nothing dials in,
    # so the host needs no open ports and no static IP.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - ai_network
    depends_on:
      - n8n
      - open-webui

networks:
  ai_network:
    driver: bridge

volumes:
  mirofish_uploads:
  neo4j_data:
  neo4j_logs:
  open_webui_data:
  open_webui_config:
  n8n_data:
  crawl4ai_cache:
  lightrag_data:
